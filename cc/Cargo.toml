[package]
name = "cc"
version = "0.1.0"
edition = "2024"

[dependencies]
vesiro-indexer-protocol = { path = "../protocol" }

anyhow = "1.0.104"
aws-config = "1.12.0"
flate2 = { version = "1.1.5", features = ["rust_backend"] }
tracing = "0.1.41"

[dependencies.aws-sdk-s3]
version = "1.146.0"
default-features = false
features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
]

[dev-dependencies]
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
