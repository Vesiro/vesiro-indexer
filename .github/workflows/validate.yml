name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on:
      - self-hosted
      - builder
      - vesiro-indexer
    environment: builder
    env:
      CARGO_TARGET_DIR: ${{ vars.CARGO_TARGET_DIR }}
    steps:
    - name: Check runner configuration
      run: |
        if [ -z "$CARGO_TARGET_DIR" ]; then
          echo "::error::CARGO_TARGET_DIR is empty. Set the CARGO_TARGET_DIR variable in the 'builder' environment (Settings -> Environments -> builder -> Environment variables)."
          exit 1
        fi
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - uses: actions/checkout@v7
    - name: Build
      run: cargo build --locked
    - name: Test
      run: cargo test --locked
    - name: Format
      run: cargo fmt --all -- --check
