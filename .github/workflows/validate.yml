name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: Swatinem/rust-cache@v2
    - name: Build
      run: cargo build --locked
    - name: Test
      run: cargo test --locked
    - name: Format
      run: cargo fmt --all -- --check
