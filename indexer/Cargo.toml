[package]
name = "vesiro-indexer"
version = "0.3.0"
edition = "2024"

[dependencies]
cc = { path = "../cc" }
vesiro-indexer-protocol = { path = "../protocol" }

anyhow = "1.0.104"
base64 = "0.23.1"
bincode = { version = "2.0.0", features = ["serde"] }
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
dotenvy = "0.15.7"
flate2 = { version = "1.1.5", features = ["rust_backend"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sled = "0.34.7"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["macros", "sync", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.19.0", features = ["serde"] }
